services:
  python-container:
    build: ./program
    volumes:
      - ./program/connections.py:/app/connections.py
    depends_on:
      - mqtt-container

  mqtt-container:
    image: eclipse-mosquitto:2.0.15
    command: mosquitto -c mosquitto/mosquitto-no-auth.conf
    ports:
      - 1883:1883
    volumes:
    - ./mosquitto:/mosquitto

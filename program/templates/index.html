<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de IA</title>
    <style>
        .tab-content > div { display: none; }
        .tab-content > div.active { display: block; }
    </style>
</head>
<body>
    <h1>Plataforma de IA</h1>
    
    <ul class="nav-tabs">
        <li><a href="#dataset" class="tab-link">Dataset</a></li>
        <li><a href="#modelo" class="tab-link">Modelo</a></li>
        <li><a href="#analisis" class="tab-link">Análisis</a></li>
        <li><a href="#prediccion" class="tab-link">Predicción</a></li>
    </ul>

    <div class="tab-content">
        <div id="dataset" class="tab-pane active">
            <h2>Dataset</h2>
            <form id="datasetForm">
                <input type="file" id="datasetFile" accept=".csv">
                <button type="submit">Cargar Dataset</button>
            </form>
            <div id="datasetPreview"></div>
        </div>

        <div id="modelo" class="tab-pane">
            <h2>Modelo</h2>
            <form id="modelForm">
                <select id="targetColumn"></select>
                <div id="featureColumns"></div>
                <button type="submit">Entrenar Modelo</button>
            </form>
            <div id="modelResults"></div>
        </div>

        <div id="analisis" class="tab-pane">
            <h2>Análisis</h2>
            <button id="analyzeButton">Analizar Modelo</button>
            <div id="analysisResults"></div>
        </div>

        <div id="prediccion" class="tab-pane">
            <h2>Predicción</h2>
            <form id="predictionForm"></form>
            <div id="predictionResults"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
